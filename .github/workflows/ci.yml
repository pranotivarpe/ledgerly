name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledgerly
          POSTGRES_PASSWORD: ledgerly
          POSTGRES_DB: ledgerly_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ledgerly:ledgerly@localhost:5432/ledgerly_test
      DATABASE_URL: postgresql://ledgerly:ledgerly@localhost:5432/ledgerly_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate -w apps/api
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ledgerly
          POSTGRES_PASSWORD: ledgerly
          POSTGRES_DB: ledgerly
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ledgerly:ledgerly@localhost:5432/ledgerly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Write API env file
        run: |
          cat > apps/api/.env <<ENV
          NODE_ENV=development
          DATABASE_URL=$DATABASE_URL
          JWT_ACCESS_SECRET=ci-access-secret-ci-access-secret-ci-access
          JWT_REFRESH_SECRET=ci-refresh-secret-ci-refresh-secret-ci-refre
          STRIPE_SECRET_KEY=sk_test_ci_dummy_key_no_network
          JOBS_ENABLED=false
          ENV
      - run: npm run db:generate -w apps/api
      - run: npx prisma migrate deploy
        working-directory: apps/api
      - run: npm run db:seed
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
